<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>가계부</title>
<meta name="theme-color" content="#1f3864">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f4f6f9; --panel:#ffffff; --panel-2:#f8fafc; --text:#1c2434; --muted:#667085; --line:#e3e8ef; --line-2:#d0d7e2;
  --accent:#1f3864; --accent-2:#2f5ca8; --accent-soft:#e8eef8; --pos:#1a7f37; --neg:#c62828; --warn-bg:#fff4e0; --warn-line:#f0c36d;
  --c1:#1f3864; --c2:#4f8fd6; --c3:#e8833a; --c4:#5fa84f; --heat:47,92,168;
  --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11151c; --panel:#191f29; --panel-2:#1f2633; --text:#e6e9ef; --muted:#97a1b3; --line:#2a3242; --line-2:#364056;
  --accent:#9db8ff; --accent-2:#7ea2f5; --accent-soft:#232e45; --pos:#5cc779; --neg:#ff6b6b; --warn-bg:#2d2616; --warn-line:#7a6125;
  --c1:#7ea2f5; --c2:#4fc3e8; --c3:#f0a35e; --c4:#7bcf6a; --heat:126,162,245; --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#11151c; --panel:#191f29; --panel-2:#1f2633; --text:#e6e9ef; --muted:#97a1b3; --line:#2a3242; --line-2:#364056;
  --accent:#9db8ff; --accent-2:#7ea2f5; --accent-soft:#232e45; --pos:#5cc779; --neg:#ff6b6b; --warn-bg:#2d2616; --warn-line:#7a6125;
  --c1:#7ea2f5; --c2:#4fc3e8; --c3:#f0a35e; --c4:#7bcf6a; --heat:126,162,245; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:56px}
.brand{font-size:18px;font-weight:700;color:var(--accent);letter-spacing:-.3px}
.spacer{flex:1}
.layout{display:flex;align-items:flex-start}
nav#tabs{flex:none;width:168px;position:sticky;top:57px;height:calc(100vh - 57px);overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding:14px 10px;background:var(--panel);border-right:1px solid var(--line)}
nav#tabs button{border:0;background:none;padding:9px 12px;border-radius:8px;border-left:3px solid transparent;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:600;text-align:left}
nav#tabs button.on{color:var(--accent);background:var(--accent-soft);border-left-color:var(--accent)}
nav#tabs button:hover{color:var(--text);background:var(--panel-2)}
nav#tabs button.on:hover{background:var(--accent-soft)}
.content{flex:1;min-width:0}
main{max-width:1320px;padding:16px 16px 60px}
select,input{background:var(--panel);border:1px solid var(--line-2);border-radius:7px;padding:6px 8px;min-width:0}
input:focus,select:focus{outline:2px solid var(--accent-2);outline-offset:-1px;border-color:transparent}
button{border:1px solid var(--line-2);background:var(--panel);border-radius:7px;padding:6px 12px;cursor:pointer}
button:hover{background:var(--panel-2)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
:root[data-theme="dark"] button.primary{color:#0f1420}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) button.primary{color:#0f1420} }
button.danger{color:var(--neg);border-color:var(--neg);background:transparent}
button.sm{padding:2px 8px;font-size:12px}
button.link{border:0;background:none;color:var(--accent-2);padding:2px 4px}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap;cursor:default}
.pill.ok{color:var(--pos);border-color:var(--pos)}
.pill.warn{color:#b26a00;border-color:var(--warn-line);background:var(--warn-bg);cursor:pointer}
.pill.err{color:var(--neg);border-color:var(--neg)}
#banner .inner{max-width:1320px;margin:12px 0 0;padding:0 16px}
.notice{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:var(--radius);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.notice p{margin:0;flex:1;min-width:240px}
h2{font-size:15px;margin:0 0 10px;color:var(--accent)}
h2 small{color:var(--muted);font-weight:400;margin-left:6px;font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);margin-bottom:16px;min-width:0}
.row{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))}
.row>.card{margin-bottom:0}
.stack{display:flex;flex-direction:column;gap:16px}
.stack>.card{margin-bottom:0}
.tel-row{grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr))}
.tel-row>.card{padding:12px clamp(8px,1vw,16px)}
table.grid.tel{table-layout:fixed;width:100%;font-size:clamp(11.5px,0.95vw,13.5px)}
table.grid.tel th,table.grid.tel td{white-space:normal;word-break:keep-all;overflow-wrap:anywhere;padding:4px clamp(3px,0.45vw,8px)}
table.grid.tel td:last-child{padding-left:2px;padding-right:0;text-align:right}
table.grid.tel button.sm{padding:1px 6px;font-size:11.5px}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
#txTable.mobile{min-width:0;table-layout:auto}
#txTable.mobile tr td{white-space:normal;padding:8px 4px;cursor:pointer}
.mtx{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.mtx-l,.mtx-r{display:flex;flex-direction:column;gap:2px;min-width:0}
.mtx-l{text-align:left;align-items:flex-start}
.mtx-l b{font-size:14px;overflow:hidden;text-overflow:ellipsis}
.mtx-l span,.mtx-r span{font-size:12px;color:var(--muted)}
.mtx-r{text-align:right;flex:none}
.mtx-r b{font-size:15px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;box-shadow:var(--shadow)}
.kpi .l{color:var(--muted);font-size:12px}
.kpi .v{font-size:clamp(17px,1.9vw,24px);font-weight:700;letter-spacing:-.5px;margin:2px 0;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--muted);font-size:12px}
.neg{color:var(--neg)} .pos{color:var(--pos)} .muted{color:var(--muted)}
.progress{height:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:6px}
.progress>i{display:block;height:100%;background:var(--accent-2)}
.progress>i.over{background:var(--neg)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg text{fill:var(--muted);font-size:11px}
.hb{display:grid;grid-template-columns:minmax(64px,128px) minmax(40px,1fr) auto;gap:4px clamp(6px,0.8vw,10px);align-items:center;font-size:clamp(11.5px,1vw,13px)}
.hb .bar-t{height:14px;background:var(--panel-2);border-radius:3px;overflow:hidden}
.hb .bar-t i{display:block;height:100%;background:var(--c2);border-radius:3px}
.hb .amt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hb .amt small{color:var(--muted);margin-left:6px;display:inline-block;min-width:42px}
.tablewrap{overflow:auto;max-width:100%}
table.grid{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.grid th,table.grid td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;white-space:nowrap}
table.grid thead th{background:var(--accent);color:#fff;font-weight:600;position:sticky;top:0;z-index:1;text-align:center}
:root[data-theme="dark"] table.grid thead th{color:#0f1420}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) table.grid thead th{color:#0f1420} }
table.grid td.num,table.grid th.num{text-align:right}
table.grid tr.sub td{background:var(--accent-soft);font-weight:700}
table.grid tr.tot td{background:var(--panel-2);font-weight:700;border-top:2px solid var(--line-2)}
table.grid tr.blk td{background:var(--panel-2);color:var(--accent);font-weight:700}
table.grid tr.hl td{background:var(--warn-bg)}
table.grid tbody tr:hover td{background:var(--panel-2)}
table.grid td.link{cursor:pointer}
table.grid td.link:hover{text-decoration:underline;color:var(--accent-2)}
table.grid td.over{color:var(--neg);font-weight:600}
table.grid td.und{background:var(--warn-bg);box-shadow:inset 0 0 0 1px var(--warn-line)}
.und-key{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:3px;padding:0 4px}
table.grid td.dim{color:var(--muted)}
table.grid td.wrap{white-space:normal;min-width:160px}
table.grid.compact th,table.grid.compact td{padding:4px 6px;font-size:12.5px}
table.grid.compact input.cell{width:78px!important;font-size:12.5px}
table.grid.fit{table-layout:fixed;width:100%;min-width:840px;font-size:clamp(9.5px,0.82vw,12.5px)}
table.grid.fit th,table.grid.fit td{font-size:inherit;padding:4px clamp(2px,0.35vw,6px)}
table.grid.fit td:first-child{white-space:normal;word-break:keep-all}
table.grid.fit.fixtbl{min-width:920px}
table.grid.fit.mid{min-width:600px}
table.grid.fit.nomin{min-width:0}
table.grid.fit.trend{min-width:960px}
table.grid.fit.trend input.cell{padding:2px 2px;letter-spacing:-.2px}
table.grid.fit.mid,table.grid.fit.nomin{font-size:clamp(11.5px,1vw,13.5px)}
table.grid.fit.wraptext td{white-space:normal;word-break:keep-all;overflow-wrap:anywhere}
table.grid.fit.wraptext td.num{white-space:nowrap}
table.grid.fit.wraptext tr:not(.blk) td:last-child{padding-left:2px;padding-right:0;text-align:right}
table.grid.fit button.sm{padding:1px 6px;font-size:11px}
table.grid.fixtbl td:nth-child(3){white-space:normal;word-break:keep-all}
table.grid.fixtbl tr:not(.blk) td:last-child{padding-left:2px;padding-right:0;text-align:right}
table.grid.fixtbl button.sm{padding:1px 6px;font-size:11px}
table.grid.fit input.cell{width:100%!important;font-size:inherit;padding:2px 3px}
.sticky-first th:first-child,.sticky-first td:first-child{position:sticky;left:0;background:var(--panel);z-index:1}
.sticky-first thead th:first-child{background:var(--accent);z-index:2}
input.cell{width:110px;text-align:right;padding:3px 6px;border-color:var(--line);background:var(--panel-2);color:var(--accent-2);font-weight:600}
input.cell:hover{border-color:var(--line-2)}
.entry{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.entry label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.entry label input,.entry label select{color:var(--text);font-size:14px}
.entry label.grow{flex:1;min-width:180px}
.entry label.chk{flex-direction:row;align-items:center;gap:5px;padding-bottom:8px}
.entry input[name=amount]{width:130px;text-align:right;font-weight:700}
.entry input[name=place]{width:150px}
.entry .actions{display:flex;gap:6px}
#txForm.entry{display:grid;grid-template-columns:minmax(118px,1.15fr) auto minmax(80px,1.25fr) minmax(110px,2fr) minmax(90px,1.1fr) minmax(100px,1.3fr) minmax(82px,.95fr) minmax(86px,1fr) auto;gap:8px;align-items:end}
#txForm.entry label{min-width:0}
#txTable td.num,#txTable th.num{padding-right:14px}
#txTable td:first-child{white-space:nowrap}
#txForm.entry label input:not([type=checkbox]),#txForm.entry label select{width:100%}
#txForm.entry label.chk{white-space:nowrap}
#txForm.entry.editing .actions{gap:4px}
#txForm.entry.editing .actions button{padding:6px 9px}
@media (max-width:1100px){
  #txForm.entry{grid-template-columns:repeat(4,minmax(0,1fr))}
  #txForm.entry label.grow{grid-column:span 2}
}
@media (max-width:640px){
  #txForm.entry{grid-template-columns:repeat(2,minmax(0,1fr))}
}
.entry.editing{outline:2px dashed var(--accent-2);outline-offset:6px;border-radius:6px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.filters input[type=search]{width:170px}
.filters .sum{margin-left:auto;font-weight:700}
.tx-filters{flex-wrap:nowrap;gap:6px;margin-bottom:6px}
.tx-filters>.msel,.tx-filters>select,.tx-filters>input[type=search]{flex:1 1 0;min-width:0;width:auto}
.tx-filters>input[type=search]{flex-grow:1.4}
.tx-filters>.msel>.msel-btn{width:100%;min-width:0;max-width:none}
.tx-filters>button{flex:none}
.tx-sumline{display:flex;justify-content:flex-end;margin-bottom:8px;font-weight:700}
@media (max-width:1000px){.tx-filters{flex-wrap:wrap}.tx-filters>.msel,.tx-filters>select,.tx-filters>input[type=search]{flex:1 1 130px}}
.msel{position:relative}
.msel-btn:not(.on){color:var(--muted)}
.msel-btn{min-width:96px;max-width:170px;text-align:left;padding:6px 26px 6px 10px;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msel-btn::after{content:"";position:absolute;right:10px;top:50%;margin-top:-3px;border:4px solid transparent;border-top-color:currentColor;border-bottom:0}
.msel-btn.on{border-color:var(--accent-2);color:var(--accent-2);font-weight:600;background:var(--accent-soft)}
.msel-pop{position:absolute;z-index:40;top:calc(100% + 4px);left:0;background:var(--panel);border:1px solid var(--line-2);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.18);padding:8px;min-width:200px}
.msel-tools{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted);padding:2px 4px 6px;border-bottom:1px solid var(--line);margin-bottom:6px;white-space:nowrap}
.msel-list{max-height:320px;overflow:auto;display:flex;flex-direction:column}
.msel-list.grid3{display:grid;grid-template-columns:repeat(3,minmax(64px,1fr))}
.msel-list label{display:flex;gap:6px;align-items:center;padding:4px 6px;border-radius:6px;cursor:pointer;white-space:nowrap}
.msel-list label:hover{background:var(--panel-2)}
.msel-list label span{overflow:hidden;text-overflow:ellipsis}
.msel-list label[hidden]{display:none}
.msel-pop.wide{width:300px}
.msel-search{width:100%;margin-bottom:6px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .hint{color:var(--muted);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);border-radius:999px;padding:3px 6px 3px 10px;font-size:13px}
.chip button{border:0;background:none;padding:0 4px;color:var(--muted);line-height:1}
.addline{display:flex;gap:6px}
.months{display:grid;grid-template-columns:repeat(12,minmax(64px,1fr));gap:6px;overflow-x:auto}
.months .mb{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--panel-2);font-size:12px}
.months .mb b{display:block;font-size:13px;font-variant-numeric:tabular-nums}
.months .mb.now{border-color:var(--accent-2);background:var(--accent-soft)}
.months .mb.soon{border-color:var(--warn-line);background:var(--warn-bg)}
.vsbar{position:relative;height:12px;background:var(--panel-2);border-radius:3px}
.vsbar i{position:absolute;left:0;top:0;bottom:0;background:var(--c2);border-radius:3px}
.vsbar i.over{background:var(--neg)}
.vsbar b{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--text)}
.warn-t{color:#c77700}
.subh{font-size:13px;margin:0 0 4px;color:var(--text);display:flex;justify-content:space-between;gap:8px}
.subh span{color:var(--muted);font-weight:400}
.list-recent{display:flex;flex-direction:column}
.list-recent div span.neg{color:var(--neg)}
.list-recent div{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.list-recent div span:first-child{color:var(--muted);width:78px;flex:none}
.list-recent div span.m{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-recent div b{font-variant-numeric:tabular-nums}
dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--panel);color:var(--text);width:min(560px,calc(100vw - 32px));box-shadow:0 12px 40px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,15,25,.45)}
.modal h3{margin:0;padding:14px 18px;border-bottom:1px solid var(--line);font-size:16px}
.mbody{padding:14px 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;max-height:65vh;overflow:auto}
.mbody .full{grid-column:1/-1}
.mfoot{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.field input,.field select{font-size:14px;color:var(--text)}
.bulk{grid-column:1/-1}
.bulk table{width:100%}
.bulk input.cell{width:100px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:99;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translateX(-50%)}
.help{color:var(--muted);font-size:13px;line-height:1.7}
.help b{color:var(--text)}
.help ol,.help ul{padding-left:20px;margin:6px 0}
@media (max-width:800px){
  .layout{display:block}
  nav#tabs{position:sticky;top:57px;z-index:15;width:auto;height:auto;flex-direction:row;overflow-x:auto;scrollbar-width:none;padding:6px 10px;border-right:0;border-bottom:1px solid var(--line)}
  nav#tabs button{border-left:0;border-bottom:2px solid transparent;border-radius:0}
  nav#tabs button.on{background:none;border-bottom-color:var(--accent)}
}
@media (max-width:640px){
  .bar{flex-wrap:wrap}
  .mbody{grid-template-columns:1fr}
  .entry label,.entry label.grow{flex:1 1 140px}
  .entry input[name=amount],.entry input[name=place]{width:100%}
  .filters input[type=search]{width:100%}
  .filters .sum{margin-left:0;width:100%}
  .kpi .v{font-size:20px}
}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand">가계부</div>
    <select id="yearSel" aria-label="연도"></select>
    <div class="spacer"></div>
    <span id="status" class="pill">시작하는 중…</span>
  </div>
</header>
<div class="layout">
  <nav id="tabs" aria-label="메뉴"></nav>
  <div class="content">
    <div id="banner"></div>
    <main id="main"></main>
  </div>
</div>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script>
'use strict';
/* ====================== 기본 상수 · 유틸 ====================== */
const K_DOC = 'gagyebu.doc', K_DIRTY = 'gagyebu.dirty', K_FILE = 'gagyebu.file', K_TAB = 'gagyebu.tab', K_YEAR = 'gagyebu.year';
const COLS = ['tx', 'fixed', 'savings', 'assets', 'monthEnd', 'annual', 'plan', 'telecom'];
const TABS = [['dash', '대시보드'], ['asset', '자산부채'], ['tx', '지출내역'], ['fixed', '고정비'], ['month', '월별요약'], ['daily', '일별추이'], ['annual', '연간예상'], ['tel', '통신비'], ['set', '설정']];
const BLOCKS = [['고정', 'Ⅰ. 고정지출'], ['변동', 'Ⅱ. 변동지출'], ['특별', 'Ⅲ. 특별·기타']];
const BLOCK_SUB = { 고정: '고정비', 변동: '변동비', 특별: '특별·기타' };
const DOW = '일월화수목금토';
const FIX_CAT = { '용돈': '부모님 용돈', '사업': '고정 사업비용' };

const $ = s => document.querySelector(s);

function emptyDoc() {

  for (const c of COLS) o[c] = Array.isArray(d[c]) ? d[c] : [];

}
// 기록 단위 병합: 같은 id면 더 나중에 고친(upd 큰) 쪽을 남김. 삭제는 del 표시(묘비)로 전파.
function merge(a, b) {

  for (const c of COLS) {

/* ====================== 집계 ====================== */
function catList() { return doc.meta.categories || []; }
function blockMap() { return new Map(catList().map(c => [c.name, c.block])); }
function compute(Y) {

  const byCat = new Map(), blk = { 고정: z(), 변동: z(), 특별: z() }, pay = new Map();
  const day = Array.from({ length: 32 }, z), undated = z(), dow = Array.from({ length: 7 }, z), sav = z(), savBy = new Map();
  for (const t of live('tx')) {

    if (!(m >= 1 && m <= 12)) continue;

    const b = bm.get(c) || '변동'; blk[b][m] += a; blk[b][0] += a;

  const head = `<colgroup><col style="width:12.5%">${M.map(() => `<col>`).join("")}<col style="width:9%"></colgroup><thead><tr><th>항목</th>${M.map(m => `<th>${m}월</th>`).join('')}<th>합계</th></tr></thead>`;
  const cell = (v, m, cat) => `<td class="num${v ? ' link' : ' dim'}"${v && cat ? ` data-act="goTx" data-m="${m}" data-cat="${esc(cat)}"` : ''}>${dash(v)}</td>`;
  let body = '';
  for (const [b, label] of BLOCKS) {
    body += `<tr class="blk"><td colspan="14">${label}</td></tr>`;
    const names = catList().filter(c => c.block === b).map(c => c.name);
    for (const k of A.byCat.keys()) if (!names.includes(k) && (A.bm.get(k) || '변동') === b) names.push(k);
    for (const nm of names) { const arr = A.byCat.get(nm) || Array(13).fill(0); body += `<tr><td>${esc(nm)}</td>${M.map(m => cell(arr[m], m, nm)).join('')}<td class="num"><b>${dash(arr[0])}</b></td></tr>`; }
    body += `<tr class="sub"><td>${label.split(' ')[1]} 소계</td>${M.map(m => `<td class="num">${dash(A.blk[b][m])}</td>`).join('')}<td class="num">${dash(A.blk[b][0])}</td></tr>`;
  }
  body += `<tr class="blk"><td colspan="14">Ⅳ. 저축·투자 <span class="muted" style="font-weight:400">(직접 입력)</span></td></tr>`;
  const items = [...(doc.meta.savingItems || [])]; for (const k of A.savBy.keys()) if (!items.includes(k)) items.push(k);
  for (const it of items) {
    const arr = A.savBy.get(it) || Array(13).fill(0);
    body += `<tr><td>${esc(it)}</td>${M.map(m => `<td class="num"><input class="cell" style="width:92px" data-fk="savings:s-${ymOf(Y, m)}-${esc(it)}:amount" value="${arr[m] ? won(arr[m]) : ''}" placeholder="-"></td>`).join('')}<td class="num"><b>${dash(arr[0])}</b></td></tr>`;
  }
  body += `<tr class="sub"><td>저축·투자 소계</td>${M.map(m => `<td class="num">${dash(A.sav[m])}</td>`).join('')}<td class="num">${dash(A.sav[0])}</td></tr>`;
  const line = (label, arr, cls = 'tot', fmt = dash) => `<tr class="${cls}"><td>${label}</td>${M.map(m => `<td class="num">${fmt(arr[m], m)}</td>`).join('')}<td class="num">${fmt(arr[0], 0)}</td></tr>`;
  const act = A.active.length;
  const bud = Array(13).fill(0); for (let m = 1; m <= 12; m++) bud[m] = A.total[m] > 0 ? budget : 0; bud[0] = budget * act;
  const diff = bud.map((b, m) => b ? A.life[m] - b : 0);
  body += line('생활지출 계 (Ⅰ+Ⅱ)', A.life);
  body += line('월 생활예산', bud, '') + `<tr><td>예산 대비 (+초과 / −절감)</td>${[...M, 0].map(m => `<td class="num ${diff[m] > 0 ? 'neg' : diff[m] < 0 ? 'pos' : 'dim'}">${diff[m] ? (diff[m] > 0 ? '+' : '') + won(diff[m]) : '-'}</td>`).join('')}</tr>`;
  body += `<tr><td>예산 집행률</td>${[...M, 0].map(m => `<td class="num ${bud[m] && A.life[m] > bud[m] ? 'neg' : ''}">${bud[m] ? (A.life[m] / bud[m] * 100).toFixed(1) + '%' : '-'}</td>`).join('')}</tr>`;
  body += line('총지출 (Ⅰ+Ⅱ+Ⅲ)', A.total) + line('총 현금유출 (Ⅰ+Ⅱ+Ⅲ+Ⅳ)', A.out);
  const WP = workPaid(Y);
  body += `<tr class="blk"><td colspan="14">Ⅴ. 사업 입금 <span class="muted" style="font-weight:400">(업무관리에서 가져옴 · 입금일 기준)</span></td></tr>`;
  if (WP) {
    const cash = WP.inc.map((v, m) => m === 0 ? A.active.reduce((s, k) => s + WP.inc[k], 0) - A.out[0] : (A.total[m] > 0 ? v - A.out[m] : 0));
    body += line('사업 입금액 (VAT 포함)', WP.inc, '');
    body += `<tr class="tot"><td>현금흐름 (입금 − 총 현금유출, 가계부 기록 있는 달)</td>${[...M, 0].map(m => `<td class="num ${cash[m] > 0 ? 'pos' : cash[m] < 0 ? 'neg' : 'dim'}">${cash[m] ? (cash[m] > 0 ? '+' : '') + won(cash[m]) : '-'}</td>`).join('')}</tr>`;
  } else body += `<tr><td colspan="14" class="dim">업무관리 데이터를 아직 불러오지 못했습니다 (설정 탭 「업무관리 연결」 참고)</td></tr>`;
  return `<div class="card"><h2>월별 요약 <small>${Y}년 · 대분류 × 월 · 금액을 누르면 해당 내역으로 이동 · 저축·투자 칸은 직접 입력</small></h2>
    <div class="tablewrap"><table class="grid compact sticky-first fit">${head}<tbody>${body}</tbody></table></div></div>`;
};

/* ====================== 화면: 고정비 ====================== */
function fixedActuals(Y) {
  const m = new Map(), ys = String(Y), curYm = todayStr().slice(0, 7);
  for (const t of live('tx')) { if (!t.memo || !t.date || !t.date.startsWith(ys)) continue; if (!m.has(t.memo)) m.set(t.memo, Array(13).fill(0)); const a = m.get(t.memo); const mm = +t.date.slice(5, 7); a[mm] += +t.amount || 0; a[0] += +t.amount || 0; if (t.date.length < 10 && t.date === curYm) (a.und = a.und || [])[mm] = 1; }
  return m;
}
VIEWS.fixed = () => {
  const Y = ui.year, act = fixedActuals(Y), M = [...Array(12).keys()].map(i => i + 1), items = live('fixed');
  const groups = []; for (const f of items) if (!groups.includes(f.group)) groups.push(f.group);
  let body = '', gt = Array(13).fill(0), gb = 0;
  for (const g of groups) {
    const rows = items.filter(f => f.group === g); let st = Array(13).fill(0), sb = 0;
    body += `<tr class="blk"><td colspan="17">${esc(g || '(구분 없음)')}</td></tr>`;
    for (const f of rows) {
      const a = act.get(f.key || f.item) || Array(13).fill(0); sb += +f.base || 0;
      for (let m = 0; m <= 12; m++) st[m] += a[m];
      body += `<tr><td>${esc(f.item)}${f.note ? `<div class="muted" style="font-size:11px">${esc(f.note)}</div>` : ''}</td><td>${esc(f.day)}</td><td>${esc(f.pay)}</td><td class="num"><b>${dash(f.base)}</b></td>${M.map(m => `<td class="num ${a[m] && f.base && a[m] > f.base * 1.001 ? 'over' : a[m] ? '' : 'dim'}${a.und && a.und[m] ? ' und' : ''}"${a.und && a.und[m] ? ' title="지출내역에 일자 미정으로 입력된 건이 있습니다"' : ''}>${dash(a[m])}</td>`).join('')}<td><button class="sm" data-act="fixEdit" data-id="${esc(f.id)}">수정</button></td></tr>`;
    }
    body += `<tr class="sub"><td>${esc(g)} 소계</td><td></td><td></td><td class="num">${dash(sb)}</td>${M.map(m => `<td class="num">${dash(st[m])}</td>`).join('')}<td></td></tr>`;
    for (let m = 0; m <= 12; m++) gt[m] += st[m]; gb += sb;
  }
  body += `<tr class="tot"><td>고정비 총계</td><td></td><td></td><td class="num">${dash(gb)}</td>${M.map(m => `<td class="num">${dash(gt[m])}</td>`).join('')}<td></td></tr>`;
  return `<div class="card"><h2>고정비 명세 <small>${Y}년 · 월별 실적은 「지출내역」의 <b>내용</b>이 매칭키와 같은 건을 자동 집계 · 기준액보다 많으면 빨간색 · <span class="und-key">노란 칸</span> = 이번 달 일자 미정으로 입력된 건 포함</small></h2>
    <div class="toolbar"><button class="primary" data-act="fixBulk">이번 달 고정비 한 번에 입력</button><button data-act="fixAdd">+ 항목 추가</button><span class="hint">한 번에 입력: 아직 입력되지 않은 고정비를 기준액으로 지출내역에 추가합니다(추가 전에 확인).</span></div>
    <div class="tablewrap"><table class="grid compact sticky-first fit fixtbl"><colgroup><col style="width:14%"><col style="width:4.5%"><col style="width:8%"><col style="width:6.5%">${M.map(() => `<col>`).join("")}<col style="width:44px"></colgroup><thead><tr><th>항목</th><th>결제일</th><th>결제수단</th><th>기준액</th>${M.map(m => `<th>${m}월</th>`).join('')}<th></th></tr></thead><tbody>${body}</tbody></table></div></div>`;
};
const FIX_FIELDS = () => [
  { k: 'group', label: '구분', list: 'dlFixGroup' }, { k: 'item', label: '항목', req: 1 },
  { k: 'key', label: '매칭키 (지출내역의 내용과 같게)', list: 'dlMemo2' }, { k: 'day', label: '결제일 (예: 25일)' },
  { k: 'pay', label: '결제수단', list: 'dlPay2' }, { k: 'base', label: '기준액', type: 'num' }, { k: 'note', label: '비고', full: 1 }];
function fixDatalists() {
  return `<datalist id="dlFixGroup">${[...new Set(live('fixed').map(f => f.group))].map(g => `<option value="${esc(g)}">`).join('')}</datalist>
  <datalist id="dlPay2">${payList().map(g => `<option value="${esc(g)}">`).join('')}</datalist>
  <datalist id="dlMemo2">${[...new Set(live('tx').map(t => t.memo).filter(Boolean))].slice(-800).map(g => `<option value="${esc(g)}">`).join('')}</datalist>`;
}
function editFixed(id) {
  const r = id ? doc.fixed.find(f => f.id === id) : { group: '', item: '', key: '', day: '', pay: '', base: 0, note: '' };
  const defs = FIX_FIELDS();
  openModal({
    title: id ? '고정비 항목 수정' : '고정비 항목 추가', body: fields(defs, r) + fixDatalists(),
    onSubmit: f => { const v = readForm(f, defs); if (!v.item) { toast('항목을 입력하세요'); return false; } if (!v.key) v.key = v.item; put('fixed', Object.assign({}, r, v, { id: id || uid() })); commit(); },
    onDelete: id ? () => { remove('fixed', id); commit(); } : null
  });
}
function bulkFixed() {
  const now = new Date(), Y = ui.year, m0 = now.getFullYear() === Y ? now.getMonth() + 1 : 1;
  const cats = new Set(catList().map(c => c.name)), pays = payList();
  const build = m => {
    const act = fixedActuals(Y), ym = ymOf(Y, m), dim = new Date(Y, m, 0).getDate();
    return live('fixed').filter(f => (+f.base || 0) > 0 && !((act.get(f.key || f.item) || [])[m])).map(f => {
      let last = null; for (const t of live('tx')) if (t.memo === (f.key || f.item) && (!last || t.date > last.date)) last = t;
      const cat = last ? last.cat : (FIX_CAT[f.group] || (cats.has(f.group) ? f.group : ''));
      let pay = last ? last.pay : (f.pay || ''); if (!last) { if (pay.startsWith('현금')) pay = '현금'; if (pay === '국민카드') pay = 'KB카드'; if (!pays.includes(pay)) pay = ''; }
      const d = parseInt(f.day); const date = d >= 1 && d <= dim ? `${ym}-${pad(d)}` : ym;
      return { f, cat, pay, place: last ? last.place : '', date };
    });
  };
  const list = m => {
    const rows = build(m);
    if (!rows.length) return `<p class="muted">${m}월 고정비는 모두 입력되어 있습니다.</p>`;
    return `<table class="grid"><thead><tr><th></th><th>항목</th><th>날짜</th><th>대분류</th><th class="num">금액</th></tr></thead><tbody>${rows.map((r, i) => `<tr><td><input type="checkbox" name="pick" value="${i}" ${r.cat ? 'checked' : ''}></td><td>${esc(r.f.item)}</td><td>${esc(dateLabel(r.date))}</td><td>${r.cat ? esc(r.cat) : '<span class="neg">대분류 없음</span>'}</td><td class="num"><input class="cell" name="amt${i}" data-money value="${won(r.f.base)}"></td></tr>`).join('')}</tbody></table>`;
  };
  openModal({
    title: '고정비 한 번에 입력', submit: '선택 항목 추가',
    body: `<label class="field full"><span>월 (${Y}년)</span><select name="month">${opts([...Array(12).keys()].map(i => [i + 1, i + 1 + '월']), m0)}</select></label><div class="bulk" id="bulkList">${list(m0)}</div><p class="help full" style="margin:0">지출내역의 <b>내용</b>이 고정비 매칭키와 같은 건이 아직 없는 항목만 보여줍니다. 금액은 기준액이며 고칠 수 있습니다.</p>`,
    onMount: f => { f.month.onchange = () => { $('#bulkList').innerHTML = list(+f.month.value); }; },
    onSubmit: f => {
      const m = +f.month.value, rows = build(m), picks = [...f.querySelectorAll('input[name=pick]:checked')].map(x => +x.value);
      let n = 0;
      for (const i of picks) { const r = rows[i]; if (!r || !r.cat) continue; put('tx', { id: uid(), date: r.date, cat: r.cat, sub: '고정비', pay: r.pay, place: r.place, memo: r.f.key || r.f.item, amount: num(f.elements['amt' + i].value) }); n++; }
      if (n) { commit(); toast(`고정비 ${n}건을 지출내역에 추가했습니다`); }
    }
  });
}

/* ====================== 화면: 일별추이 ====================== */
VIEWS.daily = () => {
  const Y = ui.year, A = compute(Y), M = [...Array(12).keys()].map(i => i + 1);
  let mx = 0; for (let d = 1; d <= 31; d++) for (const m of M) mx = Math.max(mx, A.day[d][m]);
  const heat = v => v ? `background:rgba(var(--heat),${(0.08 + 0.55 * Math.sqrt(v / mx)).toFixed(2)})` : '';
  let body = '';
  for (let d = 1; d <= 31; d++) body += `<tr><td>${d}일</td>${M.map(m => `<td class="num ${A.day[d][m] ? 'link' : 'dim'}" style="${heat(A.day[d][m])}"${A.day[d][m] ? ` data-act="goDay" data-m="${m}" data-d="${d}"` : ''}>${dash(A.day[d][m])}</td>`).join('')}<td class="num"><b>${dash(A.day[d][0])}</b></td></tr>`;
  body += `<tr><td class="dim">일자 미정</td>${M.map(m => `<td class="num dim">${dash(A.undated[m])}</td>`).join('')}<td class="num dim">${dash(A.undated[0])}</td></tr>`;
  body += `<tr class="tot"><td>합계</td>${M.map(m => `<td class="num">${dash(A.total[m])}</td>`).join('')}<td class="num">${dash(A.total[0])}</td></tr>`;
  const order = [1, 2, 3, 4, 5, 6, 0]; const dowTot = order.reduce((s, w) => s + A.dow[w][0], 0);
  const dowRows = order.map(w => `<tr><td>${DOW[w]}요일</td>${M.map(m => `<td class="num ${A.dow[w][m] ? '' : 'dim'}">${dash(A.dow[w][m])}</td>`).join('')}<td class="num"><b>${dash(A.dow[w][0])}</b></td><td class="num">${pct(A.dow[w][0], dowTot)}</td></tr>`).join('');
  return `<div class="card"><h2>① 일자별 총지출 <small>${Y}년 · 색이 진할수록 많이 쓴 날 · 누르면 그날 내역</small></h2>
    <div class="tablewrap"><table class="grid compact sticky-first fit"><colgroup><col style="width:6%">${M.map(() => `<col>`).join("")}<col style="width:9%"></colgroup><thead><tr><th>일</th>${M.map(m => `<th>${m}월</th>`).join('')}<th>합계</th></tr></thead><tbody>${body}</tbody></table></div></div>
    <div class="card"><h2>② 요일별 지출</h2><div class="tablewrap"><table class="grid compact sticky-first fit"><colgroup><col style="width:7%">${M.map(() => `<col>`).join("")}<col style="width:9%"><col style="width:6%"></colgroup><thead><tr><th>요일</th>${M.map(m => `<th>${m}월</th>`).join('')}<th>합계</th><th>비중</th></tr></thead><tbody>${dowRows}</tbody></table></div></div>`;
};

/* ====================== 화면: 자산부채 ====================== */

  return `<div class="kpis">

      <div class="kpi"><div class="l">순자산</div><div class="v ${nw.net < 0 ? 'neg' : ''}">${won(nw.net)}</div><div class="s">총자산 − 총부채</div></div>
      <div class="kpi"><div class="l">카드 미결제</div><div class="v">${won(nw.card)}</div><div class="s">다음 결제일에 나갈 카드값</div></div>
    </div>
    ${liquidityCard()}
    <div class="row" style="margin-bottom:16px">${side('자산')}${side('부채')}</div>
    <div class="card"><h2>④ 월말 순자산 추이 <small>${Y}년 · 매월 말에 기록</small></h2>

function assetMemo(r) {
  const memo = r.memo || '', lim = r.side === '부채' && memo.match(/한도\s*([\d,]+)/);

      <li><b>처음 한 번:</b> 노트북과 사무실 PC에서 각각 이 파일(가계부.html)을 Edge나 Chrome으로 열고 「데이터 파일 연결」을 눌러 같은 폴더의 <b>가계부_데이터.json</b>을 고르세요.</li>
      <li><b>그다음부터:</b> 열 때마다 「다시 연결」을 한 번 누르면 됩니다. 브라우저가 「방문할 때마다 허용」을 물으면 허용하면 더 편합니다.</li>
      <li><b>동기화:</b> 저장은 OneDrive 폴더의 데이터 파일에 바로 됩니다. 다른 PC에서 고친 내용은 OneDrive가 파일을 내려받는 즉시 자동으로 합쳐집니다. 두 PC를 동시에 열어 두어도 됩니다.</li>
      <li><b>인터넷이 끊겼을 때:</b> 그냥 계속 입력하세요. 다시 연결되면 기록 단위로 합쳐져서 양쪽 입력이 모두 남습니다.</li>
      <li><b>엑셀:</b> 「지출내역 › CSV 내보내기」로 엑셀에서 열 수 있습니다. 원래 엑셀 파일(가계부.xlsx)은 그대로 두었습니다.</li>
    </ol>
  </div>`;
};
function renameCat(i, name) {
  const old = catList()[i].name; name = name.trim();
  if (!name || name === old) { render(); return; }
  if (catList().some(c => c.name === name)) { toast('이미 있는 이름입니다'); render(); return; }
  const n = live('tx').filter(t => t.cat === old).length;
  setMeta(m => { m.categories[i].name = name; });
  if (n && confirm(`기존 지출내역 ${n}건의 대분류도 「${old}」→「${name}」으로 바꿀까요?`)) for (const t of live('tx').filter(t => t.cat === old)) put('tx', Object.assign({}, t, { cat: name }));
  commit();
}

/* ====================== 모달 ====================== */
function fields(defs, v) {
  return defs.map(d => {
    const val = v[d.k] ?? ''; let input;
    if (d.type === 'select') input = `<select name="${d.k}">${opts(d.options, val)}</select>`;
    else if (d.type === 'num') input = `<input name="${d.k}" inputmode="numeric" data-money value="${val === '' ? '' : fmtInput(val)}" style="text-align:right">`;
    else input = `<input name="${d.k}" value="${esc(val)}"${d.list ? ` list="${d.list}"` : ''}${d.req ? ' required' : ''}>`;
    return `<label class="field${d.full ? ' full' : ''}"><span>${esc(d.label)}</span>${input}</label>`;
  }).join('');
}
function readForm(f, defs) { const o = {}; for (const d of defs) { const v = f.elements.namedItem(d.k).value; o[d.k] = d.type === 'num' ? num(v) : d.int ? (parseInt(v) || 0) : v.trim(); } return o; }
function openModal({ title, body, submit = '저장', onSubmit, onDelete, onMount }) {
  const d = $('#dlg');
  d.innerHTML = `<form class="modal" novalidate><h3>${esc(title)}</h3><div class="mbody">${body}</div><div class="mfoot">${onDelete ? '<button type="button" class="danger" data-m="del">삭제</button>' : ''}<span class="spacer"></span><button type="button" data-m="cancel">취소</button><button type="submit" class="primary">${esc(submit)}</button></div></form>`;
  const f = d.querySelector('form');
  f.onsubmit = e => { e.preventDefault(); if (onSubmit(f) !== false) d.close(); };
  f.querySelector('[data-m=cancel]').onclick = () => d.close();
  if (onDelete) f.querySelector('[data-m=del]').onclick = () => { if (confirm('삭제할까요?')) { onDelete(); d.close(); } };
  onMount?.(f); d.showModal();
  const first = f.querySelector('input:not([type=checkbox]),select'); first?.focus();
}
$('#dlg').addEventListener('close', () => { if (pendingRender) { pendingRender = false; render(); } });

/* ====================== 이벤트 ====================== */
const ACT = {
  go: b => { ui.tab = b.dataset.tab; lsSet(K_TAB, ui.tab); renderTabs(); render(); },
  connect: () => connect(),
  pickOther: async () => { stored = null; await connect(); },
  createFile: () => createFile(),
  txEdit: b => { ui.edit = b.dataset.id; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); },
  txCancel: () => { ui.edit = null; render(); },
  txDel: b => { const t = doc.tx.find(x => x.id === b.dataset.id); if (t && confirm(`삭제할까요?\n${dateLabel(t.date)} ${t.memo || t.cat} ${won(t.amount)}원`)) { remove('tx', t.id); ui.edit = null; commit(); toast('삭제했습니다'); } },
  more: () => { ui.limit += 1000; fillTxTable(); },
  fReset: () => { ui.f = { m: [], cat: [], sub: [], place: [], memo: [], q: '' }; ui.limit = 1000; render(); },
  mselToggle: b => { const p = b.parentElement.querySelector('.msel-pop'); const open = p.hidden; mselCloseAll(p); p.hidden = !open; if (open) p.querySelector('.msel-search')?.focus(); },  mselClear: b => { const k = b.dataset.key; ui.f[k] = []; b.closest('.msel').querySelectorAll('input[data-mf]').forEach(c => { c.checked = false; }); mselRefresh(k); b.closest('.msel-pop').hidden = true; ui.limit = 1000; fillTxTable(); },
  csv: () => exportCsv(),
  goTx: b => { ui.f = { m: [String(+b.dataset.m)], cat: [b.dataset.cat], sub: [], place: [], memo: [], q: '' }; ui.limit = 1000; ui.tab = 'tx'; lsSet(K_TAB, 'tx'); renderTabs(); render(); window.scrollTo(0, 0); },
  goDay: b => { ui.f = { m: [String(+b.dataset.m)], cat: [], sub: [], place: [], memo: [], q: '' }; ui.limit = 1000; ui.tab = 'tx'; renderTabs(); render(); const d = `${ui.year}-${pad(b.dataset.m)}-${pad(b.dataset.d)}`; const rows = txFiltered().filter(t => t.date === d); toast(`${dateLabel(d)} · ${rows.length}건 · ${won(rows.reduce((s, t) => s + (+t.amount || 0), 0))}원`); ui.f.q = ''; $('#txTable').querySelectorAll('tbody tr').forEach(tr => { if (tr.firstChild && tr.firstChild.textContent === dateLabel(d)) tr.classList.add('hl'); }); window.scrollTo(0, 0); },
  fixEdit: b => editFixed(b.dataset.id), fixAdd: () => editFixed(null), fixBulk: () => bulkFixed(),
  assetEdit: b => editAsset(b.dataset.id), assetAdd: b => editAsset(null, b.dataset.side),
  snap: b => { const nw = netWorth(), ym = ymOf(ui.year, +b.dataset.m); const id = 'me-' + ym; const r = doc.monthEnd.find(x => x.id === id && !x.del); if (r && !confirm(`${+b.dataset.m}월 말 기록이 이미 있습니다. 현재 값으로 바꿀까요?`)) return; put('monthEnd', { id, ym, assets: nw.a, liabilities: nw.l }); commit(); toast(`${+b.dataset.m}월 말 순자산 ${won(nw.net)}원을 기록했습니다`); },
  annEdit: b => editAnnual(b.dataset.id), annAdd: () => editAnnual(null), planEdit: b => editPlan(b.dataset.id), planAdd: () => editPlan(null),
  telEdit: b => editTel(b.dataset.id), telAdd: b => editTel(null, b.dataset.sec),
  catUp: b => { const i = +b.dataset.i; if (!i) return; setMeta(m => { const c = m.categories; [c[i - 1], c[i]] = [c[i], c[i - 1]]; }); commit(); },
  catDel: b => { const i = +b.dataset.i, c = catList()[i], n = live('tx').filter(t => t.cat === c.name).length; if (!confirm(n ? `「${c.name}」을(를) 쓰는 지출내역이 ${n}건 있습니다. 목록에서만 지우고 내역은 그대로 둘까요?` : `「${c.name}」을(를) 삭제할까요?`)) return; setMeta(m => { m.categories.splice(i, 1); }); commit(); },
  catAdd: () => { const nm = $('#newCat').value.trim(); if (!nm) return; if (catList().some(c => c.name === nm)) { toast('이미 있는 이름입니다'); return; } setMeta(m => { m.categories.push({ name: nm, block: $('#newCatBlock').value, memo: '' }); }); commit(); },
  chipDel: b => { const k = b.dataset.key, i = +b.dataset.i; setMeta(m => { m[k].splice(i, 1); }); commit(); },
  chipAdd: b => { const k = b.dataset.key, el = $('#add-' + k), v = el.value.trim(); if (!v) return; if ((doc.meta[k] || []).includes(v)) { toast('이미 있습니다'); return; } setMeta(m => { (m[k] = m[k] || []).push(v); }); commit(); },
  backup: () => download(`가계부_백업_${todayStr()}.json`, JSON.stringify(doc), 'application/json'),
  importMerge: () => $('#importFile').click(),
  saveWorkPath: () => { const v = $('#workPath').value.trim(); if (!v) return; lsSet(K_WPATH, v.startsWith('/') ? v : '/' + v); ACT.workReload(); },
  workReload: async () => { await loadWork(true); render(); toast(work ? '업무관리 데이터를 다시 불러왔습니다' : '업무관리 데이터를 찾지 못했습니다'); },
  useMode: b => { const m = b.dataset.mode; if (m === storeMode()) return; lsSet(K_MODE, m); store = null; connected = false; lastErr = ''; renderBanner(); setStatus(); render(); connect(); },
  msLogout: () => { if (confirm('Microsoft 계정에서 로그아웃할까요? (입력한 내용은 OneDrive에 저장되어 있습니다)')) msLogout(); },
  savePath: () => { const v = $('#msPath').value.trim(); if (!v) return; lsSet(K_PATH, v.startsWith('/') ? v : '/' + v); store = null; connected = false; lastErr = ''; renderBanner(); setStatus(); render(); connect(); },
};
const main = $('#main');
main.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && ACT[b.dataset.act]) { e.preventDefault(); ACT[b.dataset.act](b, e); } });
$('#banner').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && ACT[b.dataset.act]) ACT[b.dataset.act](b, e); });
main.addEventListener('submit', e => { if (e.target.id === 'txForm') { e.preventDefault(); submitTx(e.target); } });
document.addEventListener('input', e => {
  const el = e.target;
  if (el.matches('[data-money], #txForm [name=amount]')) { const v = fmtInput(el.value); if (v !== el.value) el.value = v; }
  if (el.dataset.f === 'q') { ui.f.q = el.value; ui.limit = 1000; fillTxTable(); }
  if (el.dataset.msearch) { const q = el.value.trim().toLowerCase(); el.closest('.msel-pop').querySelectorAll('.msel-list label').forEach(l => { l.hidden = !!q && !l.textContent.toLowerCase().includes(q); }); }
});
main.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.mf) { const k = el.dataset.mf; ui.f[k] = [...el.closest('.msel').querySelectorAll('input[data-mf]:checked')].map(c => c.value); mselRefresh(k); ui.limit = 1000; fillTxTable(); return; }
  if (el.dataset.f && el.dataset.f !== 'q') { ui.f[el.dataset.f] = el.value; ui.limit = 1000; fillTxTable(); return; }
  if (el.closest('#txForm')) {
    const f = el.form;
    if (el.name === 'memo') memoAutofill(f);
    if (el.name === 'place') placeAutofill(f);
    if (el.name === 'cat') { delete f.dataset.auto; const c = catList().find(c => c.name === el.value); if (c && BLOCK_SUB[c.block] && (doc.meta.subTypes || []).includes(BLOCK_SUB[c.block])) f.sub.value = BLOCK_SUB[c.block]; }
    return;
  }
  if (el.dataset.fk) {
    const parts = el.dataset.fk.split(':'), col = parts[0], field = parts[parts.length - 1], id = parts.slice(1, -1).join(':');
    let r = doc[col].find(x => x.id === id && !x.del);
    if (!r) { if (col === 'monthEnd') r = { id, ym: id.slice(3) }; else if (col === 'savings') r = { id, ym: id.slice(2, 9), item: id.slice(10), amount: 0 }; else return; }
    const raw = el.value.trim();
    put(col, Object.assign({}, r, { [field]: raw === '' && col === 'monthEnd' ? '' : num(raw) }));
    commit(); return;
  }
  if (el.dataset.meta) { const k = el.dataset.meta, v = num(el.value); setMeta(m => { m[k] = v; }); if (k === 'year' && v) { ui.year = v; lsSet(K_YEAR, v); renderYear(); } commit(); return; }
  if (el.dataset.cat != null) {
    const i = +el.dataset.cat, k = el.dataset.k;
    if (k === 'name') { renameCat(i, el.value); return; }
    setMeta(m => { m.categories[i][k] = el.value; }); commit(); return;
  }
  if (el.id === 'importFile' && el.files[0]) {
    el.files[0].text().then(t => { let r; try { r = JSON.parse(t); } catch (x) { toast('JSON 파일이 아닙니다'); return; } if (r.app !== 'gagyebu') { toast('가계부 데이터 파일이 아닙니다'); return; } const before = live('tx').length; doc = merge(doc, normalize(r)); commit(); toast(`합쳤습니다 · 지출내역 ${before}건 → ${live('tx').length}건`); el.value = ''; });
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.edit && ui.tab === 'tx' && !$('#dlg').open) { ui.edit = null; render(); } });

/* ====================== 시작 ====================== */
(async function init() {
  renderTabs(); renderYear(); render(); renderBanner(); setStatus();
  const m = storeMode();
  if (m === 'ms') {
    // 로그인에서 돌아왔거나 이미 로그인되어 있으면 바로 OneDrive 파일에 연결
    try { await msInit(); if (msAccount) { store = msStore(); await openStore(); } }
    catch (e) { lastErr = e.message; }
  } else if (m === 'file') {
    stored = await idbGet('file');
    if (stored) {
      try { if (await stored.queryPermission({ mode: 'readwrite' }) === 'granted') { fh = stored; store = fileStore(fh); await openStore(); } } catch (e) { lastErr = ''; }
    }
  }
  renderBanner(); setStatus(); if (ui.tab === 'set') render();
  if (await loadWork(true)) safeRender();
  setInterval(async () => { if (!document.hidden && await loadWork()) safeRender(); }, 60000);
})();
window.__gagyebu = { load: d => { doc = normalize(d); renderYear(); render(); }, get doc() { return doc; }, setWork: d => { work = d; workAt = Date.now(); workSrc = 'test'; render(); } };
</script>
